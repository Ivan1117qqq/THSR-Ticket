name: build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install desktop dependencies
      run: python -m pip install -r requirements-desktop.txt
    - name: Check desktop source
      run: python -m flake8 -j1 --config .config/flake thsr_ticket scripts/preview_desktop.py
    - name: Offline regression with mandatory desktop suites
      run: python -m pytest -q -p no:cacheprovider --require-desktop --junitxml=build/desktop-tests.xml
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: desktop-test-report
        path: build/desktop-tests.xml
        if-no-files-found: error

  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-lock.txt
    - name: Check syntax
      run: |
        python -m flake8 -j1 --config .config/flake thsr_ticket
    - name: Test with pytest
      run: |
        python -m pytest -q -p no:cacheprovider
