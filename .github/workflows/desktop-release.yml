name: Desktop release validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest -q -p no:cacheprovider
      - run: python -m flake8 -j1 --config .config/flake thsr_ticket scripts/preview_desktop.py
      - run: python -m PyInstaller TravelDesk.spec --noconfirm
      - name: Build unsigned installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler required on runner' }
          & $compiler installer/TravelDesk.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: TravelDesk-windows
          path: dist/
  packaged-smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TravelDesk-windows
          path: dist
      - name: Isolated packaged startup without Python on PATH
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:PYTHONHOME = $null
          $env:PYTHONPATH = $null
          $env:QT_QPA_PLATFORM = 'offscreen'
          $app = Start-Process -FilePath dist/TravelDesk/TravelDesk.exe -ArgumentList '--self-test','build/package-smoke.json' -WindowStyle Hidden -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw 'Packaged startup failed' }
          $report = Get-Content build/package-smoke.json | ConvertFrom-Json
          if (-not ($report.qml -and $report.ocr_standard -and $report.ocr_beta -and $report.playwright_driver)) { throw 'Missing runtime resource' }
      - name: Installer upgrade and uninstall validation
        shell: pwsh
        run: ./scripts/test_installer.ps1 -Installer dist/installer/TravelDesk-Setup-0.3.0.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-smoke-report
          path: build/package-smoke.json
